<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
</head>
<body>
    <div>
        <form class="bookSubmitForm" >
            <h1>Book Entry Form</h1>
            <hr>
            <br>
            <br>
            <label for="Bname">Title:</label>
            <input type="text" name="Bname" id="bookName" placeholder="Enter book name">
            <br>
            <br>
            <label for="Author">Author name:</label>
            <input type="text" name="Author" id="authorName" placeholder="Enter author of the book">
            <br>
            <br>
            <label for="ISBN">ISBN No.:</label>
            <input type="number" name="ISBN" id="isbnNumber" class="inputs" placeholder="Enter book's ISBN no.">
            <br>
            <br>
            <label for="PDate">Publication Date:</label>
            <input type="date" name="PDate" id="publishDate">
            <br>
            <br>
            <label for="genre">Genre:</label>
            <input type="text" name="genre" id="genreInput" placeholder="Ex. Sci-fi, fiction">
            <br>
            <br>
            <input type="submit">
        </form>
    </div>
    <div>
        <h1>Library</h1>
        <table class="libraryTable">
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN no.</th>
                <th>Publish date</th>
                <th>Age(years)</th>
                <th>Genre <select name="genre" id="genreSelect">
                    <option value="all" selected>All</option>
        <option value="fiction">Fiction</option>
        <option value="non-fiction">Non-fiction</option>
        <option value="sci-fi">Sci-fi</option>
        <option value="comedy">Comedy</option>
         <option value="thriller">Thriller</option>
        <option value="action">Action</option>
        <option value="horror" >Horror</option>
        <option value="mystery">Mystery</option>
      </select></th>
                <th class="edit">Edit</th>
                <th class="delete">Delete</th>
            </tr>
        </table>
        <button id="saveEdit">Save Changes</button>
    </div>
    <script src="script.js"></script>
    </script>
</body>
</html>
