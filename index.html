<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Book Management System</title>
</head>
<body>
    <div class="form-wrapper">
    <div class="formContainer">
        <form class="bookSubmitForm" id="bookForm" >
            <h1>Book Entry Form</h1>
            <hr>
            <br>
            <label for="bookName">Title:</label>
            <input type="text" name="Bname" id="bookName"  class="inputBox" placeholder="Enter book name">
             <br>
            <br>
            <label for="authorName">Author name:</label>
            <input type="text" name="Author" id="authorName" class="inputBox" placeholder="Enter author of the book">
             <br>
            <br>
            <label for="isbnNumber">ISBN No.:</label>
            <input type="number" name="ISBN" id="isbnNumber" class="inputBox" placeholder="Enter book's ISBN no.">
             <br>
            <br>
            <label for="publishDate">Publication Date:</label>
            <input type="date" name="PDate" id="publishDate" class="inputBox">
             <br>
            <br>
            <label for="pageNo">Hardcopy size(Pages):</label>
            <input type="number" name="pageNo" id="pageNo" class="inputBox">
             <br>
            <br>
            <label for="ebookSize">Ebook Size(MB):</label>
            <input type="number" name="ebookSize" id="ebookSize" class="inputBox">
             <br>
            <br>
            <label for="genreInput">Genre:</label>
            <select name="genre" id="genreInput">
                <option value="" disabled selected hidden>Select a genre</option>
        <option value="fiction">Fiction</option>
        <option value="non-fiction">Non-fiction</option>
        <option value="sci-fi">Sci-fi</option>
        <option value="comedy">Comedy</option>
         <option value="thriller">Thriller</option>
        <option value="action">Action</option>
        <option value="horror" >Horror</option>
        <option value="mystery">Mystery</option>
      </select>
             <br>
            <label for="price">Price(₹):</label>
            <input type="number" name="price" id="price" class="inputBox">
             <br>
            <br>
            <input type="submit" class="addToLibrary">
        </form>
        </div>
    <div class="libraryContainer">
        <h2>Library</h2>
        <hr>
        <table class="libraryTable" id="libraryTable">
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN no.</th>
                <th>Publish date</th>
                <th>Age(years)</th>
                <th>Genre <select name="genre" id="genreSelect">
                    <option value="all" selected>All</option>
        <option value="fiction">Fiction</option>
        <option value="non-fiction">Non-fiction</option>
        <option value="sci-fi">Sci-fi</option>
        <option value="comedy">Comedy</option>
         <option value="thriller">Thriller</option>
        <option value="action">Action</option>
        <option value="horror" >Horror</option>
        <option value="mystery">Mystery</option>
      </select></th>
                <th>Pages</th>
                <th>Ebook Size(MB)</th>
                <th>Discount(%)</th>
                <th>Discounted Price(₹)</th>
                <th class="editRow">Edit</th>
                <th class="deleteRow">Delete</th>
            </tr>
        </table>
        <button id="saveEdit">Save Changes</button>
    </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
