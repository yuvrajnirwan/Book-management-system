<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
</head>
<body>
    <div>
        <form>
            <h1>Book Entry Form</h1>
            <hr>
            <br>
            <br>
            <label for="Bname">Title:</label>
            <input type="text" name="Bname" placeholder="Enter book name">
            <br>
            <br>
            <label for="Author">Author name:</label>
            <input type="text" name="Author" placeholder="Enter author of the book">
            <br>
            <br>
            <label for="ISBN">ISBN No.:</label>
            <input type="text" name="ISBN" placeholder="Enetr book's ISBN no.">
            <br>
            <br>
            <label for="PDate">Publication Date:</label>
            <input type="date" name="PDate" id="">
            <br>
            <br>
            <label for="genre">Genre:</label>
            <input type="text" name="genre" placeholder="Ex. Sci-fi, fiction">
            <br>
            <br>
            <input type="submit">
        </form>
    </div>
</body>
</html>
